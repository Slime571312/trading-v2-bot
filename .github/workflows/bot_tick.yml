name: Bot Tick

on:
  schedule:
    - cron: '*/5 * * * *'   # alle 5 Minuten
  workflow_dispatch:          # manuell über GitHub UI triggerbar

# Nur ein Tick gleichzeitig — kein zweiter startet während der erste läuft
concurrency:
  group: bot-tick
  cancel-in-progress: false

permissions:
  contents: write   # für git push

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4   # stirbt bevor der nächste 5-Min-Tick startet

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-bot.txt

      - name: Dependencies installieren
        run: pip install -r backend/requirements-bot.txt

      - name: Credentials laden
        run: |
          echo "${{ secrets.BOT }}" > /tmp/bot_secret.txt
          python3 - <<'EOF'
          content = open('/tmp/bot_secret.txt').read().strip()
          lines = [l.strip() for l in content.split('\n') if l.strip()]
          # Wert nach ":" oder "=" extrahieren; sonst ganze Zeile
          values = []
          for line in lines:
              if ':' in line:
                  values.append(line.split(':', 1)[1].strip())
              elif '=' in line:
                  values.append(line.split('=', 1)[1].strip())
              else:
                  values.append(line)
          # Reihenfolge: API-Key, Passwort, Email (Email zuletzt)
          if len(values) < 3:
              raise ValueError(f"Nur {len(values)} Werte gefunden, brauche 3")
          with open('.env', 'w') as f:
              f.write(f'CAPITAL_API_KEY={values[0]}\n')
              f.write(f'CAPITAL_API_PASSWORD={values[1]}\n')
              f.write(f'CAPITAL_EMAIL={values[2]}\n')
          print(f"Credentials geladen: {len(values)} Werte")
          EOF

      - name: Bot Tick ausführen
        env:
          CACHE_DIR: /tmp/bot_cache
          PYTHONPATH: backend
        run: python -m src.live.gh_runner

      - name: State committen
        run: |
          git config user.name "Trading Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f backend/state/live_state.json
          git diff --staged --quiet || git commit -m "bot: tick $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          git push
