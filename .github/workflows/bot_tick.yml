name: Bot Tick

on:
  schedule:
    # Mehrere Zeiten erhöhen die Chance dass mindestens einer feuert
    # (GH Actions Free-Tier Cron ist unzuverlässig)
    - cron: '*/5 * * * *'      # 00, 05, 10, …
    - cron: '2-59/5 * * * *'   # 02, 07, 12, …
  workflow_dispatch:           # manuell ODER per PAT-Self-Dispatch

# Nur ein Tick gleichzeitig
concurrency:
  group: bot-tick
  cancel-in-progress: false

permissions:
  contents: write
  actions: write    # für Self-Dispatch via gh api

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Neuesten State pullen
        run: git pull origin main --rebase

      - name: Python Setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-bot.txt

      - name: Dependencies installieren
        run: pip install -r backend/requirements-bot.txt

      - name: Bot Tick ausführen
        env:
          CAPITAL_API_KEY: ${{ secrets.CAPITALAPIKEY }}
          CAPITAL_EMAIL: ${{ secrets.CAPITALEMAIL }}
          CAPITAL_API_PASSWORD: ${{ secrets.CAPITALAPIPASSWORT }}
          CACHE_DIR: /tmp/bot_cache
          PYTHONPATH: backend
        run: python -m src.live.gh_runner

      - name: State committen
        run: |
          git config user.name "Trading Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f backend/state/live_state.json
          git diff --staged --quiet || git commit -m "bot: tick $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          git pull origin main --rebase
          git push

      # Self-Dispatch: Triggere den nächsten Run am Ende dieses Runs.
      # Nutzt PAT_TOKEN (Fine-Grained PAT mit Actions:write) — GITHUB_TOKEN kann
      # keine Workflows triggern (Anti-Loop-Schutz von GitHub).
      # Wenn kein PAT vorhanden: nur Cron läuft (unzuverlässig).
      - name: Nächsten Run triggern
        if: success() && env.PAT_TOKEN != ''
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # Warte 30s damit der Run-Slot frei wird, dann dispatch
          sleep 30
          curl -X POST \
            -H "Authorization: Bearer $PAT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/bot_tick.yml/dispatches \
            -d '{"ref":"main"}'
          echo "✓ Nächster Run getriggert"
