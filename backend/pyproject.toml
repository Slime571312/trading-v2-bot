[project]
name = "trading-v2-backend"
version = "0.1.0"
description = "ICT Multi-TF Bot + Backtest + Chat — backend"
requires-python = ">=3.11"
dependencies = [
  # Web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "websockets>=13.1",
  # Data
  "pandas>=2.2",
  "numpy>=2.0,<3.0",
  # Backtest (ab Etappe 3)
  "backtesting>=0.6",
  "bokeh>=3.4",
  # Chat (ab Etappe 6)
  "anthropic>=0.40",
  # Self-Improve (ab Etappe 7)
  "optuna>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
