# Prometheus Configuration für Trading-Bot v2
# Docs: https://prometheus.io/docs/prometheus/latest/configuration/configuration/

global:
  scrape_interval: 15s        # Default scrape interval
  evaluation_interval: 15s    # Default evaluation interval
  external_labels:
    monitor: "trading-bot"
    environment: "local"

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # Alerts werden via structlog + Telegram gesendet, nicht via Alertmanager

# Rules configuration
rule_files:
  - "/etc/prometheus/rules.yml"

# Scrape configurations
scrape_configs:
  # Trading Bot FastAPI Backend
  - job_name: "trading-bot"
    static_configs:
      - targets: ["host.docker.internal:8000"]
    metrics_path: "/metrics"
    scrape_interval: 15s
    scrape_timeout: 10s
    honor_timestamps: true
    scheme: http

  # Node Exporter (System Metrics)
  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9100"]
    scrape_interval: 30s
    scrape_timeout: 10s
    honor_timestamps: true

  # Prometheus selbst
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    scrape_interval: 15s
